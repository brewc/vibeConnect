server:
  listen_ssh: 0.0.0.0:22
  listen_tunnel: 0.0.0.0:4444
  listen_api: 0.0.0.0:4443
  tunnel_public_host: server
  ssh_host_key_path: /etc/vibeconnectd/secrets/ssh_host_ed25519_key
  tls_cert_path: /etc/vibeconnectd/secrets/server_tls.crt
  tls_key_path: /etc/vibeconnectd/secrets/server_tls.key
  enrollment_tls_ca_bundle_path: /etc/vibeconnectd/secrets/enrollment_tls_ca.crt

postgres:
  dsn_env: VIBECONNECT_POSTGRES_DSN

certs:
  agent_ca_key_path: /etc/vibeconnectd/secrets/agent_ca.key
  agent_ca_cert_path: /etc/vibeconnectd/secrets/agent_ca.crt
  user_ca_key_path: /etc/vibeconnectd/secrets/user_ca.key
  user_ca_public_key_path: /etc/vibeconnectd/secrets/user_ca.pub
  agent_cert_lifetime_days: 30
  user_cert_ttl_hours: 4

tunnel:
  tls_ca_bundle: /etc/vibeconnectd/secrets/agent_ca.crt
  heartbeat_seconds: 30
  max_sessions_per_agent: 64
  frame_max_bytes: 1048576
  node_ssh_port: 2222

auth:
  public_keys:
    source: file
    file_path: /etc/vibeconnectd/authorized_keys.yaml
  ldap:
    enabled: true
    use_tls: true
    validate_tls: true
  azure_ad:
    enabled: false
    use_managed_identity: false

replay:
  directory: /var/lib/vibeconnectd/replay
  integrity_key_path: /etc/vibeconnectd/secrets/replay.key
  retention_days: 30

metrics:
  listen: 127.0.0.1:9100

install_dirs: /usr/local/bin,/etc/vibeconnectd,/var/lib/vibeconnectd
secret_paths: /etc/vibeconnectd/secrets/agent_ca.key,/etc/vibeconnectd/secrets/user_ca.key,/etc/vibeconnectd/secrets/replay.key,/etc/vibeconnectd/secrets/server_tls.key

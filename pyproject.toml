[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeconnect"
version = "0.0.0"
description = "SSH bastion with agent proxy and replay."
readme = "SPEC.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "asyncpg>=0.29",
    "asyncssh>=2.14",
    "cryptography>=42",
    "ldap3>=2.9",
    "msal>=1.28",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]
package = [
    "pyinstaller>=6",
]

[project.scripts]
vibeconnect-server = "server.main:main"
vibeconnect-agent = "agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["vibeconnect_common", "server", "agent"]

[tool.coverage.run]
branch = true
source = ["vibeconnect_common", "server", "agent"]

[tool.coverage.report]
show_missing = true
fail_under = 85

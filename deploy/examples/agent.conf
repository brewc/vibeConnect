[enrollment]
node_name = node-01
api_url = https://vibeconnect.example.test:4443/enroll
tls_ca_bundle = /etc/vibeconnect/ca.crt
node_ssh_host_public_key = ssh-ed25519 AAAA...

[tunnel]
server_url = https://vibeconnect.example.test:4444/tunnel
tls_ca_bundle = /etc/vibeconnect/ca.crt
heartbeat_seconds = 30

[proxy]
target = 127.0.0.1:2222

[identity]
path = /var/lib/vibeconnect/identity.json
